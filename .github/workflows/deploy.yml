name: Deploy Portfolio to AWS

on:
  push:
    branches:
      - master

permissions:
  id-token: write   # required for OIDC token generation
  contents: read    # required for actions/checkout

env:
  AWS_REGION: us-east-1
  BUCKET_NAME: opubacharles-portfolio-623244137074
  TF_VERSION: 1.6.0

jobs:
  deploy:
    name: Terraform + S3 Deploy
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------
      # 1. Checkout repository
      # -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # 2. Authenticate to AWS via GitHub OIDC
      # No long-lived access keys are stored in GitHub Secrets.
      # GitHub generates a short-lived OIDC token that AWS
      # exchanges for temporary credentials via the IAM role.
      # -------------------------------------------------------
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # -------------------------------------------------------
      # 3. Setup Terraform
      # -------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # -------------------------------------------------------
      # 4. Terraform Init
      # -------------------------------------------------------
      - name: Terraform Init
        run: terraform init

      # -------------------------------------------------------
      # 5. Terraform Format Check
      # -------------------------------------------------------
      - name: Terraform Format Check
        run: terraform fmt -check

      # -------------------------------------------------------
      # 6. Terraform Validate
      # -------------------------------------------------------
      - name: Terraform Validate
        run: terraform validate

      # -------------------------------------------------------
      # 7. Terraform Plan
      # -------------------------------------------------------
      - name: Terraform Plan
        run: terraform plan -var="bucket_name=${{ env.BUCKET_NAME }}" -var="region=${{ env.AWS_REGION }}"

      # -------------------------------------------------------
      # 8. Terraform Apply
      # Runs only on pushes to master
      # -------------------------------------------------------
      - name: Terraform Apply
        run: terraform apply -auto-approve -var="bucket_name=${{ env.BUCKET_NAME }}" -var="region=${{ env.AWS_REGION }}"

      # -------------------------------------------------------
      # 9. Sync website files to S3
      # The bucket is private; only CloudFront can read it.
      # -------------------------------------------------------
      - name: Sync website to S3
        run: |
          aws s3 sync website/ s3://${{ env.BUCKET_NAME }}/ \
            --delete \
            --cache-control "no-cache, no-store, must-revalidate"

      # -------------------------------------------------------
      # 10. Invalidate CloudFront cache
      # Forces CloudFront to serve the latest files immediately.
      # -------------------------------------------------------
      - name: Invalidate CloudFront cache
        run: |
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='Charles Opuba AWS Cloud Resume Portfolio'].Id" \
            --output text)
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"

      # -------------------------------------------------------
      # 11. Print CloudFront URL
      # -------------------------------------------------------
      - name: Print deployment URL
        run: |
          echo "Deployment complete."
          terraform output cloudfront_url
